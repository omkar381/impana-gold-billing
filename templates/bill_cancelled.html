<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bill cancelled</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: #f4f6f8; font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #101828; }
    .box { max-width: 360px; background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; padding: 28px 24px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0; color: #667085; font-size: 15px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>This bill was cancelled</h1>
    <p>Bill {{ bill.bill_number }} is no longer valid. Please contact the shop if you have a question.</p>
  </div>
</body>
</html>
